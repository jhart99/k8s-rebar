apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "intel-arc-rebar.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "intel-arc-rebar.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "intel-arc-rebar.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "intel-arc-rebar.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostPID: true
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: arc-rebar
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: GPU_MEMORY_SIZE
              value: {{ .Values.gpuMemorySize | quote }}
            - name: TARGET_PCI_BDF
              value: {{ .Values.targetPciBdf | quote }}
            - name: DRY_RUN
              value: {{ .Values.dryRun | quote }}
            - name: SLEEP_AFTER
              value: {{ .Values.sleepAfter | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: host-sys
              mountPath: /host-sys
            - name: host-run
              mountPath: /host-run
      volumes:
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-run
          hostPath:
            path: /run
            type: Directory
